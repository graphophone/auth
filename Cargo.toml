[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
deadpool-redis = "0.23.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
r2d2 = "0.8.10"
redis = { version = "1.7.0", features = ["tokio-comp", "r2d2"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
yaml_serde = "0.10.7"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tonic-prost-build = "0.14"
